<!DOCTYPE html>
<html lang="es">
<head>
    <script>
        if (sessionStorage.getItem('isLoggedIn') !== 'true' || sessionStorage.getItem('userRole') !== 'Docente') {
            window.location.href = "login.html";
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Documentos Firmados - Universidad Blackwell</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --sidebar-bg: #1e3a8a;
            --sidebar-active: #3b82f6;
            --main-bg: #f8fafc;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --accent-blue: #223f93;
            --logout-red: #e11d48;
            --dynamic-font-size: 1rem;
        }

        body {
            font-family: 'Inter', sans-serif; background-color: var(--main-bg);
            margin: 0; display: flex; height: 100vh; overflow: hidden;
        }

        .content-area { font-size: var(--dynamic-font-size); padding: 40px; max-width: 1200px; width: 100%; margin: 0 auto; overflow-y: auto;}
        
        /* Font Controls */
        .font-controls {
            display: flex; align-items: center; gap: 10px;
            background: #f1f5f9; padding: 5px 12px;
            border-radius: 50px; font-size: 0.85rem;
            color: var(--text-muted); border: 1px solid #e2e8f0;
        }
        .btn-font {
            background: none; border: none; color: var(--text-dark);
            font-weight: bold; padding: 0 5px; cursor: pointer; transition: transform 0.1s;
        }
        .btn-font:active { transform: scale(1.3); }
        #fontSizeLabel { min-width: 60px; text-align: center; font-weight: 500; }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 260px; background-color: var(--sidebar-bg); color: white;
            display: flex; flex-direction: column; flex-shrink: 0; padding: 20px 0;
        }
        .sidebar-brand { padding: 0 25px 30px; display: flex; align-items: center; gap: 10px; }
        .sidebar-brand i { font-size: 24px; }
        .sidebar-brand div b { display: block; line-height: 1; font-size: 1.1rem; }
        .sidebar-brand div span { font-size: 0.7rem; opacity: 0.7; }

        .nav-menu { flex-grow: 1; padding: 0 15px; }
        .nav-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 15px;
            color: rgba(255,255,255,0.7); text-decoration: none; font-size: 0.85rem;
            border-radius: 8px; margin-bottom: 5px; transition: all 0.2s;
        }
        .nav-item:hover { color: white; background: rgba(255,255,255,0.1); }
        .nav-item.active { background-color: var(--sidebar-active); color: white; font-weight: 500; }

        .sidebar-footer { padding: 20px; background: rgba(0,0,0,0.2); font-size: 0.75rem; }
        .user-info { margin-bottom: 15px; opacity: 0.9; }
        .user-info b { display: block; font-size: 0.8rem; }

        .btn-logout {
            width: 100%; background-color: var(--logout-red); color: white;
            border: none; padding: 8px; border-radius: 6px; font-weight: 600;
            display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s;
        }
        .btn-logout:hover { background-color: #be123c; }

        /* --- MAIN CONTENT --- */
        .main-wrapper { flex-grow: 1; display: flex; flex-direction: column; overflow-y: hidden; }
        header {
            background: white; padding: 15px 40px; border-bottom: 1px solid #e2e8f0;
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
        }
        header h2 { font-size: 1.25rem; font-weight: 700; margin: 0; color: var(--text-dark); }
        header p { margin: 0; font-size: 0.75rem; color: var(--text-muted); }

        .page-title-section { margin-bottom: 20px; }
        .page-title-section h3 { font-weight: 800; margin-bottom: 5px; color: var(--text-dark); }
        .page-title-section p { color: var(--text-muted); font-size: 0.9rem; }

        /* Estilo Alerta Azul */
        .alert-custom {
            background-color: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af;
            padding: 15px 20px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 30px;
        }

        /* Estilos específicos para Documentos */
        .doc-card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-bottom: 15px; display: flex; align-items: center; gap: 20px; transition: 0.3s; }
        .doc-icon { font-size: 24px; color: #10b981; background: #ecfdf5; padding: 15px; border-radius: 10px; }
        .doc-info { flex-grow: 1; }
        .doc-title { font-weight: 600; color: var(--text-dark); margin: 0; }
        .doc-meta { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
        .doc-btn { padding: 8px 16px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; text-decoration: none; transition: 0.3s; }
        .btn-view { background: var(--accent-blue); color: white; }
        .btn-view:hover { background: #1e3a8a; color: white; }

        /* Skeleton Loading */
        .skeleton { background: #e2e8f0; border-radius: 4px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        @media (max-width: 768px) { .sidebar { display: none; } }
    </style>
</head>
<body>

    <!-- Sidebar Lateral -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <i class="fa-solid fa-graduation-cap"></i>
            <div><b>Blackwell</b><span>Universidad</span></div>
        </div>

        <nav class="nav-menu">
            <a href="docente.html" class="nav-item"><i class="fa-solid fa-user"></i> Información Personal</a>
            <a href="misdocumentos.html" class="nav-item"><i class="fa-solid fa-file-lines"></i> Mis Documentos</a>
            <a href="docsfirmados.html" class="nav-item active"><i class="fa-solid fa-file-signature"></i> Documentos Firmados</a>
            <a href="carpetadocente.html" class="nav-item"><i class="fa-solid fa-folder-open"></i> Carpeta Docente</a>
            <a href="misclases.html" class="nav-item"><i class="fa-solid fa-chalkboard-user"></i> Mis Clases</a>
        </nav>

        <div class="sidebar-footer">
            <div class="user-info">
                <span>Sesión activa:</span>
                <b id="sidebar-userid">Cargando...</b>
                <span class="badge bg-light text-dark mt-1">Docente</span>
            </div>
            <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión</button>
        </div>
    </aside>

    <!-- Contenido Principal -->
    <main class="main-wrapper">
        <header>
            <div><h2>Sistema de Gestión de Expedientes</h2><p>Portal del Docente</p></div>
        </header>

        <div class="content-area">
            <h3>Mis Documentos</h3>
            <p class="text-muted">Lista de tus documentos académicos y oficiales.</p>
            
            <div id="docs-container">
                <p>Cargando documentos...</p>
            </div>
        </div>
    </main>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwkSKl0QriWo-qHWBL5OESTZe609-l_Q0pgpnU1pMcvW3UK8HrXlXdUjRECId7tAxHA/exec";

        function logout() {
            if(confirm("¿Estás seguro que deseas cerrar sesión?")) {
                sessionStorage.clear();
                window.location.href = "login.html";
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const userName = sessionStorage.getItem('userName');
            if(userName) {
                document.getElementById('sidebar-userid').innerText = userName;
                loadDocuments(userName);
            }
        });

         async function loadDocuments(userId) {
            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'get_documents', id: userId })
                });
                const res = await response.json();
                
                if (res.status === 'success') {
                    const container = document.getElementById('docs-container');
                    container.innerHTML = ''; // Limpiar loader

                    // Crear tarjetas (Ejemplo para CV, Handbook y Diplomas)
                    const addDoc = (titulo, meta, url) => {
                        if(!url) return;
                        container.innerHTML += `
                            <div class="doc-card">
                                <div class="doc-icon"><i class="fa-solid fa-file-pdf"></i></div>
                                <div class="doc-info">
                                    <p class="doc-title">${titulo}</p>
                                    <p class="doc-meta">${meta}</p>
                                </div>
                                <a href="${url}" target="_blank" class="doc-btn btn-view">Ver Documento</a>
                            </div>`;
                    };

                    addDoc("Curriculum Vitae", `Registrado el: ${res.fecha}`, res.cv);
                    addDoc("Faculty Handbook", "Documento Institucional", res.handbook);
                    
                    res.diplomas.forEach(d => {
                        addDoc(`${d.grado} en ${d.rama}`, "Diploma Académico", d.url);
                    });
                }
            } catch (e) {
                console.error(e);
                document.getElementById('docs-container').innerHTML = "Error al cargar documentos.";
            }
        }

        // Lógica de navegación
        const navItems = document.querySelectorAll('.nav-item');
        navItems.forEach(item => { 
            item.addEventListener('click', (e) => { 
                // Permite seguir la ruta en los href (evita preventDefault si tiene un destino válido)
                if(item.getAttribute('href') === '#') e.preventDefault(); 
            }); 
        });

        // Tamaño de fuente
        let currentSizeIndex = 1; 
        const sizes =["0.85rem", "1rem", "1.2rem"];
        const labels = ["Pequeño", "Normal", "Grande"];
        function changeFontSize(direction) {
            currentSizeIndex += direction;
            if (currentSizeIndex < 0) currentSizeIndex = 0;
            if (currentSizeIndex > 2) currentSizeIndex = 2;
            document.getElementById('fontSizeLabel').innerText = labels[currentSizeIndex];
            document.documentElement.style.setProperty('--dynamic-font-size', sizes[currentSizeIndex]);
        }
    </script>
</body>
</html>
