<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Blackwell - Universidad Blackwell</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #f4f7fa;   
            --card-header-bg: #1e3a8a;
            --primary-blue: #3b82f6; 
            --primary-dark: #1e3a8a;
            --text-gray: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background-color: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        .card-header-custom {
            background-color: var(--card-header-bg);
            padding: 40px 20px 30px;
            text-align: center;
            color: white;
            position: relative;
        }

        .icon-circle {
            background-color: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            width: 70px; height: 70px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 15px;
            border: 2px solid rgba(255,255,255,0.3);
        }

        .icon-circle i { color: white; font-size: 32px; }

        .card-header-custom h1 { font-size: 1.4rem; font-weight: 700; margin: 0; letter-spacing: -0.5px;}
        .card-header-custom p { font-size: 0.85rem; opacity: 0.85; margin-top: 5px; font-weight: 300; }

        .card-body { padding: 35px 30px; }

        /* FLOATING LABELS - Estilo App Móvil */
        .form-floating-custom {
            position: relative; margin-bottom: 20px;
        }

        .form-floating-custom input {
            width: 100%; padding: 16px 15px; border: 1.5px solid var(--border-color);
            border-radius: 12px; outline: none; font-size: 0.95rem; color: #1e293b;
            background-color: transparent; transition: all 0.2s ease;
        }

        .form-floating-custom label {
            position: absolute; top: 50%; left: 15px; transform: translateY(-50%);
            color: var(--text-gray); font-size: 0.95rem; pointer-events: none;
            transition: all 0.2s ease; background-color: white; padding: 0 5px;
            display: flex; align-items: center; gap: 8px;
        }

        /* Activación del floating effect al hacer click/escribir */
        .form-floating-custom input:focus,
        .form-floating-custom input:not(:placeholder-shown) {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .form-floating-custom input:focus ~ label,
        .form-floating-custom input:not(:placeholder-shown) ~ label {
            top: 0; font-size: 0.75rem; color: var(--primary-blue); font-weight: 600;
        }

        .btn-login {
            background-color: var(--primary-dark); color: white; width: 100%; padding: 14px;
            border-radius: 12px; font-weight: 600; border: none; font-size: 1rem;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: all 0.3s; margin-top: 10px; box-shadow: 0 4px 15px rgba(30, 58, 138, 0.2);
        }
        .btn-login:hover { background-color: #152963; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(30, 58, 138, 0.3); }

        .demo-accounts {
            margin-top: 25px; text-align: center; font-size: 0.75rem; color: #94a3b8;
            background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px dashed #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="card-header-custom">
            <div class="icon-circle"><i class="fa-solid fa-graduation-cap"></i></div>
            <h1>Universidad Blackwell</h1>
            <p>Sistema de Gestión de Expedientes</p>
        </div>

        <div class="card-body">
            
            <form id="loginForm">
                <!-- Floating Input: Usuario -->
                <div class="form-floating-custom">
                    <!-- placeholder=" " en blanco es obligatorio para la animación CSS -->
                    <input type="text" id="emailInput" placeholder=" " required autocomplete="off">
                    <label for="emailInput"><i class="fa-solid fa-user"></i> Usuario</label>
                </div>

                <!-- Floating Input: Contraseña -->
                <div class="form-floating-custom">
                    <input type="password" id="passwordInput" placeholder=" " required>
                    <label for="passwordInput"><i class="fa-solid fa-lock"></i> Contraseña</label>
                </div>

                <button type="submit" class="btn-login">
                    Iniciar Sesión <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="demo-accounts">
                <span>Ingresa con tus credenciales asignadas por la administración.</span>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwkSKl0QriWo-qHWBL5OESTZe609-l_Q0pgpnU1pMcvW3UK8HrXlXdUjRECId7tAxHA/exec";

        document.getElementById('loginForm').onsubmit = function(e) {
            e.preventDefault();
            
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const btn = e.target.querySelector('button');
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Validando...';

            fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "login", email: email, password: password })
            })
            .then(res => res.json())
            .then(response => {
                if (response.status === "success") {
                    let rolAsignado = response.role ? response.role.toUpperCase() : "";

                    // GUARDADO INTELIGENTE Y PERSISTENTE
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userId', response.userId);   
                    localStorage.setItem('userName', response.userName); 

                    if (rolAsignado === 'DOCENTE') {
                        localStorage.setItem('userRole', 'Docente');
                        window.location.href = "dashboard-docente.html";
                    } else if (rolAsignado.startsWith('DIRECTOR_')) {
                        localStorage.setItem('userRole', response.role);
                        window.location.href = "Admin/director-dashboard.html";
                    } else if (rolAsignado === 'EJECUTIVA CREDENCIALES') {
                        localStorage.setItem('userRole', 'Ejecutiva Credenciales');
                        window.location.href = "Admin/evaluacion-dashboard.html"; // Su panel exclusivo
                    } else if (
                        rolAsignado === 'ADMINISTRATIVO' || 
                        rolAsignado === 'ADMINISTRADOR' ||
                        rolAsignado === 'EJECUTIVO LICENCIAMIENTO' ||
                        rolAsignado === 'ASESORA ACADEMICA'
                    ) {
                        // Guardamos el rol exacto para futuros permisos, pero todos van al mismo panel
                        localStorage.setItem('userRole', response.role);
                        window.location.href = "Admin/administrativo.html";
                    }
                    else {
                        alert("Error: Tu usuario no tiene un rol válido asignado en el sistema.");
                        btn.disabled = false;
                        btn.innerHTML = 'Iniciar Sesión <i class="fa-solid fa-arrow-right"></i>';
                    }

                } else if (response.status === "inactive") {
                    // AQUÍ ESTÁ EL MENSAJE PARA USUARIOS INACTIVOS
                    alert(response.message); // Muestra: "Este usuario no tiene acceso al sistema."
                    btn.disabled = false;
                    btn.innerHTML = 'Iniciar Sesión <i class="fa-solid fa-arrow-right"></i>';

                } else {
                    // Si el status es "error" (usuario o clave mal)
                    alert("Usuario o contraseña incorrectos.");
                    btn.disabled = false;
                    btn.innerHTML = 'Iniciar Sesión <i class="fa-solid fa-arrow-right"></i>';
                }
            })
            .catch(err => {
                console.error(err);
                alert("Error de conexión con el servidor. Por favor intenta de nuevo.");
                btn.disabled = false;
                btn.innerHTML = 'Iniciar Sesión <i class="fa-solid fa-arrow-right"></i>';
            });
        };
    </script>
</body>
</html>
