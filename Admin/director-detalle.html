<!DOCTYPE html>
<html lang="es">
<head>
    <script>
        const isLoggedIn = localStorage.getItem('isLoggedIn');
        const userRole = localStorage.getItem('userRole');
        if (isLoggedIn !== 'true' || (!userRole || !userRole.toUpperCase().startsWith('DIRECTOR_'))) {
            window.location.href = "../index.html"; // Sube un nivel hacia la raíz para encontrar el login
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Docente | Blackwell University</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        html { font-size: 15px; }
        :root {
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --primary-dark: #1e3a8a;
            --bg-body: #f8fafc;
            --sidebar-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --gray-border: #e2e8f0;
            --sidebar-width: 260px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; display: flex; height: 100vh; overflow: hidden; letter-spacing: -0.01em; }

        /* --- SIDEBAR (idéntico a director-dashboard.html) --- */
        .sidebar { width: var(--sidebar-width); background: var(--sidebar-bg); border-right: 1px solid rgba(0,0,0,0.05); display: flex; flex-direction: column; padding: 24px 16px; flex-shrink: 0; }
        .brand-section { display: flex; align-items: center; gap: 12px; padding: 0 12px 32px; text-decoration: none; }
        .logo-box { min-width: 42px; height: 42px; background: var(--primary-dark); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; }
        .brand-text { font-weight: 800; font-size: 1.2rem; color: var(--primary-dark); }
        .user-preview { display: flex; align-items: center; gap: 12px; padding: 12px; background: #f1f5f9; border-radius: 16px; margin-bottom: 24px; }
        .avatar { min-width: 36px; height: 36px; background: #c5a880; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: white; font-size: 13px; }
        .user-meta { display: flex; flex-direction: column; line-height: 1.2; }
        .user-meta b { font-size: 13px; } .user-meta span { font-size: 11px; color: var(--text-muted); }
        .nav-list { list-style: none; padding: 0; margin: 0; flex-grow: 1; }
        .nav-link { display: flex; align-items: center; gap: 16px; padding: 12px 14px; color: var(--text-muted); text-decoration: none; border-radius: 12px; margin-bottom: 6px; transition: var(--transition); }
        .nav-link:hover, .nav-link.active { background: #eff6ff; color: var(--primary); font-weight: 600; }

        /* --- CONTENT AREA --- */
        .main-wrapper { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; }
        header { padding: 20px 48px; display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 5; border-bottom: 1px solid var(--gray-border); }
        .content-area { padding: 40px; display: flex; flex-direction: column; align-items: center; width: 100%; }
        .centered-container { width: 100%; max-width: 1000px; text-align: left; }

        .breadcrumb-nav { margin-bottom: 1.25rem; font-size: 13px; }
        .back-link { text-decoration: none; color: var(--text-muted); display: flex; align-items: center; gap: 6px; font-weight: 600; transition: 0.2s; }
        .back-link:hover { color: var(--primary); }

        /* --- TARJETA DE PERFIL DEL DOCENTE --- */
        .profile-card { background: white; border: 1px solid var(--gray-border); border-radius: 20px; padding: 28px 32px; display: flex; align-items: center; gap: 20px; margin-bottom: 32px; }
        .profile-avatar { width: 68px; height: 68px; border-radius: 50%; background: var(--primary-light); color: var(--primary-dark); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.4rem; flex-shrink: 0; object-fit: cover; }
        .profile-name { font-weight: 800; font-size: 1.35rem; color: var(--primary-dark); margin: 0; }
        .profile-meta { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 6px; font-size: 0.85rem; color: var(--text-muted); }
        .profile-meta span { display: flex; align-items: center; gap: 6px; }

        /* --- SECCIONES --- */
        .section-title { font-weight: 800; font-size: 1.15rem; color: var(--primary-dark); margin: 0 0 16px; display: flex; align-items: center; gap: 10px; }
        .section-title i { color: var(--primary); }

        /* --- TARJETA DE EXPEDIENTE / INVITACIÓN --- */
        .registro-card { background: white; border: 1px solid var(--gray-border); border-radius: 16px; padding: 20px 24px; margin-bottom: 16px; }
        .registro-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
        .registro-id { font-weight: 700; font-size: 0.95rem; color: var(--text-main); }
        .registro-sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }

        .badge-status { display: inline-block; padding: 6px 12px; border-radius: 30px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; }
        .status-por-contratar { background: #ffeedd; color: #ea580c; }
        .status-contratado { background: #d1fae5; color: #059669; }
        .status-neutro { background: #f1f5f9; color: #64748b; }

        .doc-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: #f8fafc; border: 1px solid var(--gray-border); border-radius: 10px; margin-bottom: 8px; font-size: 0.85rem; }
        .doc-row:last-child { margin-bottom: 0; }
        .doc-row .doc-nombre { font-weight: 600; color: var(--text-main); }
        .doc-firmas { display: flex; gap: 8px; flex-shrink: 0; }
        .firma-tag { font-size: 0.68rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
        .firma-tag.ok { background: #dcfce7; color: #15803d; }
        .firma-tag.pendiente { background: #fef3c7; color: #b45309; }
        .firma-tag.noaplica { background: #f1f5f9; color: #94a3b8; }

        .btn-firmar-ahora { background: var(--primary-dark); color: white; font-weight: 700; font-size: 0.82rem; border: none; padding: 10px 18px; border-radius: 10px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; transition: 0.2s; margin-top: 12px; }
        .btn-firmar-ahora:hover { background: var(--primary); color: white; }
        .aviso-completo { display: flex; align-items: center; gap: 8px; color: #15803d; font-weight: 700; font-size: 0.85rem; margin-top: 12px; }
        .aviso-sin-docs { color: var(--text-muted); font-size: 0.85rem; font-style: italic; }

        .empty-note { text-align: center; padding: 2rem 1rem; color: var(--text-muted); background: white; border: 1px dashed var(--gray-border); border-radius: 16px; }

        /* --- PAGINACIÓN --- */
        .pagination-wrap { display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap; }
        .page-btn { min-width: 36px; height: 36px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--gray-border); background: white; color: var(--text-muted); font-weight: 700; font-size: 0.82rem; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; transition: 0.2s; }
        .page-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
        .page-btn.active { background: var(--primary-dark); border-color: var(--primary-dark); color: white; }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* --- MÓVIL --- */
        .sidebar-overlay {
            display: none; position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.4);
            z-index: 999; backdrop-filter: blur(3px); opacity: 0; transition: opacity 0.3s ease;
        }
        @media (max-width: 768px) {
            .sidebar {
                position: fixed; left: -280px; top: 0;
                height: 100vh; z-index: 1000; width: 260px !important;
                box-shadow: 10px 0 30px rgba(0,0,0,0.15); transition: left 0.3s ease;
            }
            .sidebar.show-mobile { left: 0; }
            .sidebar-overlay.active { display: block; opacity: 1; }
            header { padding: 15px 20px; }
            .content-area { padding: 20px 15px; }
            .profile-card { flex-direction: column; text-align: center; padding: 24px; }
            .profile-meta { justify-content: center; }
            .registro-header { flex-direction: column; }
            .doc-row { flex-direction: column; align-items: flex-start; gap: 8px; }
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleMobileSidebar()"></div>

    <aside class="sidebar" id="sidebar">
        <a href="#" class="brand-section">
            <div class="logo-box"><i class="fa-solid fa-graduation-cap"></i></div>
            <span class="brand-text">Blackwell</span>
        </a>
        <div class="user-preview">
            <div class="avatar" id="txtAvatar">DIR</div>
            <div class="user-meta"><b id="txtNombre">Director</b><span>Director Blackwell</span></div>
        </div>
        <ul class="nav-list">
            <li><a href="director-dashboard.html" class="nav-link active"><i class="fa-solid fa-file-signature"></i> <span class="link-text">Expedientes por Firmar</span></a></li>
        </ul>
        <a href="#" onclick="logout()" class="nav-link" style="color: #f43f5e; margin-top: auto;">
            <i class="fa-solid fa-right-from-bracket"></i> <span class="link-text">Cerrar Sesión</span>
        </a>
    </aside>

    <main class="main-wrapper">
        <header>
            <div class="d-flex align-items-center gap-3">
                <button class="btn border-0 p-0 d-md-none text-dark fs-4" onclick="toggleMobileSidebar()">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div>
                    <h5 class="fw-bold mb-0" style="color: var(--primary-dark)">Detalle de Docente</h5>
                    <p class="text-muted small m-0">Expedientes e invitaciones</p>
                </div>
            </div>
        </header>

        <div class="content-area">
            <div class="centered-container">
                <div class="breadcrumb-nav">
                    <a href="director-dashboard.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Volver a Firmas Pendientes</a>
                </div>

                <div class="profile-card" id="profileCard">
                    <div class="profile-avatar" id="profileAvatarWrap">--</div>
                    <div style="min-width:0;">
                        <h1 class="profile-name" id="profileNombre">Cargando...</h1>
                        <div class="profile-meta">
                            <span id="profileId"><i class="fa-solid fa-id-badge"></i> —</span>
                            <span id="profileCorreo"><i class="fa-solid fa-envelope"></i> —</span>
                            <span id="profileCelular"><i class="fa-solid fa-phone"></i> —</span>
                        </div>
                    </div>
                </div>

                <div class="section-title"><i class="fa-solid fa-folder-tree"></i> Expedientes</div>
                <div id="contenedorExpedientes" class="mb-3">
                    <div class="empty-note"><i class="fa-solid fa-spinner fa-spin me-2"></i>Cargando expedientes...</div>
                </div>
                <div id="paginacionExpedientes" class="mb-4"></div>

                <div class="section-title"><i class="fa-solid fa-chalkboard-user"></i> Invitaciones</div>
                <div id="contenedorInvitaciones" class="mb-3">
                    <div class="empty-note"><i class="fa-solid fa-spinner fa-spin me-2"></i>Cargando invitaciones...</div>
                </div>
                <div id="paginacionInvitaciones"></div>
            </div>
        </div>
    </main>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwkSKl0QriWo-qHWBL5OESTZe609-l_Q0pgpnU1pMcvW3UK8HrXlXdUjRECId7tAxHA/exec";
        const urlParams = new URLSearchParams(window.location.search);
        const docenteId = urlParams.get('docenteId') || urlParams.get('docId');

        const rolActual = (localStorage.getItem('userRole') || '').toUpperCase();
        const esZamudio = rolActual === 'DIRECTOR_ZAMUDIO';
        const nombreDirectorMostrado = esZamudio ? 'Director Zamudio' : (rolActual === 'DIRECTOR_ERNESTO' ? 'Assistant Director Ernesto' : 'Director');

        // Documentos que le corresponde firmar a los directores en cada tipo de registro
        const DOCS_EXPEDIENTE = ["Letter of Appointment", "Confidentiality Agreement"];
        const DOCS_INVITACION = ["Letter of Appointment", "Proposed Salary", "Academic Preparation Evaluation Form", "Job Description", "Assigned Employee Notice and Acknowledgments", "Direct Deposit Authorization Form"];

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('txtNombre').innerText = nombreDirectorMostrado;
            document.getElementById('txtAvatar').innerText = nombreDirectorMostrado.substring(0, 2).toUpperCase();

            if (!docenteId) {
                Swal.fire('Enlace no válido', 'Falta el ID del docente en la URL.', 'error');
                return;
            }
            cargarPerfilDocente();
            cargarExpedientes();
            cargarInvitaciones();
        });

        async function cargarPerfilDocente() {
            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'get_profile', id: docenteId }) });
                const response = await res.json();
                if (response.status === 'success' && response.data) {
                    const d = response.data;
                    const nombreCompleto = `${d.nombres || ''} ${d.apellidos || ''}`.trim() || 'Docente';
                    document.getElementById('profileNombre').innerText = nombreCompleto;
                    document.getElementById('profileId').innerHTML = `<i class="fa-solid fa-id-badge"></i> ${d.id || docenteId}`;
                    document.getElementById('profileCorreo').innerHTML = `<i class="fa-solid fa-envelope"></i> ${d.correo || '—'}`;
                    document.getElementById('profileCelular').innerHTML = `<i class="fa-solid fa-phone"></i> ${d.celular || '—'}`;

                    const avatarWrap = document.getElementById('profileAvatarWrap');
                    if (d.url_foto) {
                        avatarWrap.innerHTML = `<img src="${d.url_foto}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;" onerror="this.parentElement.innerText='${nombreCompleto.substring(0,2).toUpperCase()}'">`;
                    } else {
                        avatarWrap.innerText = nombreCompleto.substring(0, 2).toUpperCase();
                    }
                } else {
                    document.getElementById('profileNombre').innerText = 'Docente no encontrado';
                }
            } catch (e) {
                document.getElementById('profileNombre').innerText = 'Error al cargar el perfil';
            }
        }

        function firmadoPor(fileObj, zamudio) { return !!fileObj && !!(zamudio ? fileObj.zamudioFirmado : fileObj.ernestoFirmado); }
        function noAplicaPara(fileObj, zamudio) { return !!fileObj && !!(zamudio ? fileObj.noAplicaZamudio : fileObj.noAplicaErnesto); }

        function formatearFecha(fechaStr) {
            if (!fechaStr) return '—';
            try {
                const d = new Date(fechaStr);
                if (isNaN(d.getTime())) return String(fechaStr);
                return d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
            } catch (e) { return String(fechaStr); }
        }

        // Arma el HTML de una tarjeta de expediente o invitación a partir de su lista de documentos
        function renderRegistroCard({ tipo, id, estadoReal, estadoLabel, estadoClase, fechaTexto, docsFirmables, docsData }) {
            const docsConUrl = docsFirmables
                .map(nombre => ({ nombre, ...(docsData[nombre] || {}) }))
                .filter(d => d.url);

            let filasHtml = '';
            let pendienteParaMi = false;

            docsConUrl.forEach(d => {
                const zOk = firmadoPor(d, true), zNo = noAplicaPara(d, true);
                const eOk = firmadoPor(d, false), eNo = noAplicaPara(d, false);
                const miOk = esZamudio ? zOk : eOk;
                const miNo = esZamudio ? zNo : eNo;
                if (!miOk && !miNo) pendienteParaMi = true;

                const tagZamudio = zOk ? `<span class="firma-tag ok"><i class="fa-solid fa-check"></i> Zamudio</span>`
                    : (zNo ? `<span class="firma-tag noaplica" title="No requiere firma de Zamudio"><i class="fa-solid fa-minus"></i> Zamudio</span>`
                    : `<span class="firma-tag pendiente"><i class="fa-solid fa-clock"></i> Zamudio</span>`);
                const tagErnesto = eOk ? `<span class="firma-tag ok"><i class="fa-solid fa-check"></i> Ernesto</span>`
                    : (eNo ? `<span class="firma-tag noaplica" title="No requiere firma de Ernesto"><i class="fa-solid fa-minus"></i> Ernesto</span>`
                    : `<span class="firma-tag pendiente"><i class="fa-solid fa-clock"></i> Ernesto</span>`);

                filasHtml += `
                <div class="doc-row">
                    <span class="doc-nombre">${d.nombre}</span>
                    <div class="doc-firmas">${tagZamudio}${tagErnesto}</div>
                </div>`;
            });

            const linkParam = tipo === 'expediente' ? `exp=${id}` : `inv=${id}`;
            const linkFirmar = `firma-director.html?${linkParam}&role=${rolActual}`;
            const habilitadoParaFirmar = String(estadoReal || '').trim().toLowerCase() === 'pendiente firma directores';

            let footerHtml = '';
            if (docsConUrl.length === 0) {
                footerHtml = `<p class="aviso-sin-docs m-0 mt-2"><i class="fa-regular fa-clock me-1"></i>Aún no hay documentos generados para firma de directores.</p>`;
            } else if (!habilitadoParaFirmar) {
                footerHtml = `<p class="aviso-sin-docs m-0 mt-2"><i class="fa-regular fa-clock me-1"></i>Todavía no está habilitado para firma de directores (estado actual: ${estadoLabel}).</p>`;
            } else if (pendienteParaMi) {
                footerHtml = `<a href="${linkFirmar}" class="btn-firmar-ahora"><i class="fa-solid fa-file-signature"></i> Firmar ahora</a>`;
            } else {
                footerHtml = `<div class="aviso-completo"><i class="fa-solid fa-circle-check"></i> Ya firmaste todos tus documentos de este registro.</div>`;
            }

            return `
            <div class="registro-card">
                <div class="registro-header">
                    <div>
                        <div class="registro-id">${id}</div>
                        <div class="registro-sub">${fechaTexto}</div>
                    </div>
                    <span class="badge-status ${estadoClase}">${estadoLabel}</span>
                </div>
                ${filasHtml || '<p class="aviso-sin-docs m-0">Sin documentos generados todavía.</p>'}
                ${footerHtml}
            </div>`;
        }

        function traducirEstadoExpediente(estadoReal) {
            const e = String(estadoReal || '').toLowerCase();
            if (e === 'contratado') return { label: 'Contratado', clase: 'status-contratado' };
            if (['pendiente firma directores', 'firmado por docente', 'Expediente enviado'].includes(e)) return { label: 'Por contratar', clase: 'status-por-contratar' };
            if (e === 'cancelado') return { label: 'Cancelado', clase: 'status-neutro' };
            return { label: estadoReal || 'Sin estado', clase: 'status-neutro' };
        }

        function traducirEstadoInvitacion(estadoReal) {
            const e = String(estadoReal || '').toLowerCase();
            if (e === 'completado') return { label: 'Completado', clase: 'status-contratado' };
            if (['pendiente firma directores', 'firmado por docente'].includes(e)) return { label: 'Por firmar (Directores)', clase: 'status-por-contratar' };
            return { label: estadoReal || 'Sin estado', clase: 'status-neutro' };
        }

        const PAGE_SIZE = 5;
        let expedientesCards = [];
        let paginaExpedientesActual = 1;
        let invitacionesCards = [];
        let paginaInvitacionesActual = 1;

        function renderPaginado(cards, pagina, contenedorId, paginacionId, onCambiarPagina) {
            const cont = document.getElementById(contenedorId);
            const totalPaginas = Math.max(1, Math.ceil(cards.length / PAGE_SIZE));
            pagina = Math.min(Math.max(1, pagina), totalPaginas);

            const inicio = (pagina - 1) * PAGE_SIZE;
            const items = cards.slice(inicio, inicio + PAGE_SIZE);
            cont.innerHTML = items.length ? items.join('') : '<div class="empty-note">No hay registros para mostrar.</div>';

            const pagCont = document.getElementById(paginacionId);
            if (cards.length <= PAGE_SIZE) { pagCont.innerHTML = ''; return; }

            let botones = `<button type="button" class="page-btn" ${pagina === 1 ? 'disabled' : ''} onclick="(${onCambiarPagina})(${pagina - 1})"><i class="fa-solid fa-chevron-left"></i></button>`;
            for (let p = 1; p <= totalPaginas; p++) {
                botones += `<button type="button" class="page-btn ${p === pagina ? 'active' : ''}" onclick="(${onCambiarPagina})(${p})">${p}</button>`;
            }
            botones += `<button type="button" class="page-btn" ${pagina === totalPaginas ? 'disabled' : ''} onclick="(${onCambiarPagina})(${pagina + 1})"><i class="fa-solid fa-chevron-right"></i></button>`;
            pagCont.innerHTML = `<div class="pagination-wrap">${botones}</div>`;
        }

        function irAPaginaExpedientes(p) {
            paginaExpedientesActual = p;
            renderPaginado(expedientesCards, paginaExpedientesActual, 'contenedorExpedientes', 'paginacionExpedientes', 'irAPaginaExpedientes');
        }

        function irAPaginaInvitaciones(p) {
            paginaInvitacionesActual = p;
            renderPaginado(invitacionesCards, paginaInvitacionesActual, 'contenedorInvitaciones', 'paginacionInvitaciones', 'irAPaginaInvitaciones');
        }

        async function cargarExpedientes() {
            const cont = document.getElementById('contenedorExpedientes');
            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'get_expedientes_docente', docenteId: docenteId }) });
                const response = await res.json();
                if (response.status !== 'success' || !response.data || response.data.length === 0) {
                    cont.innerHTML = '<div class="empty-note">Este docente no tiene expedientes registrados.</div>';
                    return;
                }

                const detalles = await Promise.all(response.data.map(exp =>
                    fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'get_expediente_data', expId: exp.idExpediente }) })
                        .then(r => r.json())
                        .then(d => ({ base: exp, detalle: d }))
                        .catch(() => ({ base: exp, detalle: null }))
                ));

                // Más recientes primero
                detalles.sort((a, b) => new Date(b.base.fechaCreacion || 0) - new Date(a.base.fechaCreacion || 0));

                expedientesCards = detalles.map(({ base, detalle }) => {
                    const info = traducirEstadoExpediente(base.estadoReal);
                    const docsData = (detalle && detalle.status === 'success' && detalle.expediente && detalle.expediente.urls) ? detalle.expediente.urls : {};
                    return renderRegistroCard({
                        tipo: 'expediente',
                        id: base.idExpediente,
                        estadoReal: base.estadoReal,
                        estadoLabel: info.label,
                        estadoClase: info.clase,
                        fechaTexto: `Creado: ${formatearFecha(base.fechaCreacion)}`,
                        docsFirmables: DOCS_EXPEDIENTE,
                        docsData: docsData
                    });
                });
                paginaExpedientesActual = 1;
                renderPaginado(expedientesCards, paginaExpedientesActual, 'contenedorExpedientes', 'paginacionExpedientes', 'irAPaginaExpedientes');
            } catch (e) {
                cont.innerHTML = '<div class="empty-note text-danger">Error al cargar los expedientes.</div>';
            }
        }

        async function cargarInvitaciones() {
            const cont = document.getElementById('contenedorInvitaciones');
            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'get_invitations', docenteId: docenteId }) });
                const response = await res.json();
                if (response.status !== 'success' || !response.data || response.data.length === 0) {
                    cont.innerHTML = '<div class="empty-note">Este docente no tiene invitaciones registradas.</div>';
                    return;
                }

                const detalles = await Promise.all(response.data.map(inv =>
                    fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'get_invitacion_data', idInvitacion: inv.id }) })
                        .then(r => r.json())
                        .then(d => ({ base: inv, detalle: d }))
                        .catch(() => ({ base: inv, detalle: null }))
                ));

                detalles.sort((a, b) => new Date(b.base.fecha || 0) - new Date(a.base.fecha || 0));

                invitacionesCards = detalles.map(({ base, detalle }) => {
                    const info = traducirEstadoInvitacion(base.estado);
                    const docsData = (detalle && detalle.status === 'success' && detalle.documentos) ? detalle.documentos : {};
                    return renderRegistroCard({
                        tipo: 'invitacion',
                        id: base.id,
                        estadoReal: base.estado,
                        estadoLabel: info.label,
                        estadoClase: info.clase,
                        fechaTexto: `Curso: ${base.curso || '—'} • Creada: ${formatearFecha(base.fecha)}`,
                        docsFirmables: DOCS_INVITACION,
                        docsData: docsData
                    });
                });
                paginaInvitacionesActual = 1;
                renderPaginado(invitacionesCards, paginaInvitacionesActual, 'contenedorInvitaciones', 'paginacionInvitaciones', 'irAPaginaInvitaciones');
            } catch (e) {
                cont.innerHTML = '<div class="empty-note text-danger">Error al cargar las invitaciones.</div>';
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = "../index.html";
        }

        function toggleMobileSidebar() {
            document.getElementById('sidebar').classList.toggle('show-mobile');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }
    </script>
</body>
</html>
